<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Terminal - 登录</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1e1e2e; color: #cdd6f4; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; }
.login-box { background: #181825; border: 1px solid #45475a; border-radius: 12px; padding: 40px; width: 360px; text-align: center; }
.login-box h1 { font-size: 24px; margin-bottom: 8px; color: #89b4fa; }
.login-box p { font-size: 13px; color: #6c7086; margin-bottom: 24px; }
.form-group { margin-bottom: 16px; text-align: left; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: #a6adc8; margin-bottom: 6px; text-transform: uppercase; }
.form-group input { width: 100%; padding: 10px 12px; background: #313244; border: 1px solid #45475a; border-radius: 6px; color: #cdd6f4; font-size: 14px; outline: none; }
.form-group input:focus { border-color: #89b4fa; }
.btn { width: 100%; padding: 10px; background: #89b4fa; color: #1e1e2e; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; }
.btn:hover { background: #74a8f7; }
.error { color: #f38ba8; font-size: 13px; margin-top: 12px; display: none; }
</style>
</head>
<body>
<div class="login-box">
  <h1>⚡ Super Terminal</h1>
  <p>请输入访问密码</p>
  <div class="form-group">
    <label>密码</label>
    <input type="password" id="password" placeholder="输入密码" autofocus />
  </div>
  <button class="btn" id="btn-login">登 录</button>
  <div class="error" id="error">密码错误</div>
</div>
<script>
document.getElementById('btn-login').addEventListener('click', async () => {
  const pw = document.getElementById('password').value;
  const err = document.getElementById('error');
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    if (res.ok) {
      const data = await res.json();
      localStorage.setItem('st_token', data.token);
      location.href = '/';
    } else {
      err.style.display = 'block';
    }
  } catch(e) {
    err.textContent = '连接失败';
    err.style.display = 'block';
  }
});
document.getElementById('password').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('btn-login').click();
});
</script>
</body>
</html>
